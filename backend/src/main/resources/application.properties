spring.application.name=viabank-backend
server.port=3000

# MySQL - troque quando o banco existir.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/via_bank?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# O schema fica em /database/01_schema.sql.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT. Em producao, defina JWT_SECRET por variavel de ambiente.
app.jwt.secret=${JWT_SECRET:kZukynURuwAG4pg9hXQ2WBn7HZOZr1nBI3vzhmabw9n}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# Frontend local.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}

# Apenas para desenvolvimento.
app.features.demo-deposit=${DEMO_DEPOSIT:true}
